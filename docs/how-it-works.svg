<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 670" width="880" height="670" role="img" aria-label="How AI Act Check works: an agent reads the free questions, gets a 402, pays 0.60 USD over Stripe MPP, and the rules engine returns the verdict with a receipt">
<rect width="880" height="670" rx="14" fill="#14113A"/>
<defs><marker id="a-free" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C9C5E8"/></marker><marker id="a-paid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF7A50"/></marker><marker id="a-out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2BD46A"/></marker></defs>
<text x="90" y="58" text-anchor="middle" fill="#F1EFFA" font-size="17" font-weight="700" font-family="Arial, Helvetica, sans-serif">You</text>
<text x="90" y="78" text-anchor="middle" fill="#C9C5E8" font-size="12.5" font-family="Arial, Helvetica, sans-serif">in plain words</text>
<line x1="90" y1="100" x2="90" y2="640" stroke="#2C2860" stroke-width="2"/>
<text x="260" y="58" text-anchor="middle" fill="#F1EFFA" font-size="17" font-weight="700" font-family="Arial, Helvetica, sans-serif">Agent</text>
<text x="260" y="78" text-anchor="middle" fill="#C9C5E8" font-size="12.5" font-family="Arial, Helvetica, sans-serif">Claude Code, Cursor...</text>
<line x1="260" y1="100" x2="260" y2="640" stroke="#2C2860" stroke-width="2"/>
<text x="440" y="58" text-anchor="middle" fill="#F1EFFA" font-size="17" font-weight="700" font-family="Arial, Helvetica, sans-serif">AI Act Check</text>
<text x="440" y="78" text-anchor="middle" fill="#C9C5E8" font-size="12.5" font-family="Arial, Helvetica, sans-serif">the API</text>
<line x1="440" y1="100" x2="440" y2="640" stroke="#2C2860" stroke-width="2"/>
<text x="620" y="58" text-anchor="middle" fill="#F1EFFA" font-size="17" font-weight="700" font-family="Arial, Helvetica, sans-serif">Stripe MPP</text>
<text x="620" y="78" text-anchor="middle" fill="#C9C5E8" font-size="12.5" font-family="Arial, Helvetica, sans-serif">test card or Tempo</text>
<line x1="620" y1="100" x2="620" y2="640" stroke="#2C2860" stroke-width="2"/>
<text x="780" y="58" text-anchor="middle" fill="#F1EFFA" font-size="17" font-weight="700" font-family="Arial, Helvetica, sans-serif">Outputs</text>
<text x="780" y="78" text-anchor="middle" fill="#C9C5E8" font-size="12.5" font-family="Arial, Helvetica, sans-serif">screen, record</text>
<line x1="780" y1="100" x2="780" y2="640" stroke="#2C2860" stroke-width="2"/>
<circle cx="24" cy="126" r="11" fill="#FBE86A"/>
<text x="24" y="130" text-anchor="middle" fill="#0C0C10" font-size="12" font-weight="800" font-family="Arial, Helvetica, sans-serif">1</text>
<line x1="96" y1="130" x2="254" y2="130" stroke="#C9C5E8" stroke-width="2.2" marker-end="url(#a-free)"/>
<text x="175.0" y="122" text-anchor="middle" fill="#F1EFFA" font-size="13.5" font-family="Arial, Helvetica, sans-serif">use case, in plain words</text>
<circle cx="24" cy="174" r="11" fill="#FBE86A"/>
<text x="24" y="178" text-anchor="middle" fill="#0C0C10" font-size="12" font-weight="800" font-family="Arial, Helvetica, sans-serif">2</text>
<line x1="266" y1="178" x2="434" y2="178" stroke="#C9C5E8" stroke-width="2.2" marker-end="url(#a-free)"/>
<text x="350.0" y="170" text-anchor="middle" fill="#F1EFFA" font-size="13.5" font-family="Arial, Helvetica, sans-serif">GET /questions (free)</text>
<circle cx="24" cy="222" r="11" fill="#FBE86A"/>
<text x="24" y="226" text-anchor="middle" fill="#0C0C10" font-size="12" font-weight="800" font-family="Arial, Helvetica, sans-serif">3</text>
<rect x="252" y="212" width="16" height="22" rx="3" fill="#C9C5E8" opacity=".9"/>
<text x="276" y="227" fill="#F1EFFA" font-size="13.5" font-family="Arial, Helvetica, sans-serif">maps use case to answers</text>
<circle cx="24" cy="270" r="11" fill="#FBE86A"/>
<text x="24" y="274" text-anchor="middle" fill="#0C0C10" font-size="12" font-weight="800" font-family="Arial, Helvetica, sans-serif">4</text>
<line x1="266" y1="274" x2="434" y2="274" stroke="#C9C5E8" stroke-width="2.2" marker-end="url(#a-free)"/>
<text x="350.0" y="266" text-anchor="middle" fill="#F1EFFA" font-size="13.5" font-family="Arial, Helvetica, sans-serif">POST /classify + answers</text>
<circle cx="24" cy="318" r="11" fill="#FF4F1A"/>
<text x="24" y="322" text-anchor="middle" fill="#0C0C10" font-size="12" font-weight="800" font-family="Arial, Helvetica, sans-serif">5</text>
<line x1="434" y1="322" x2="266" y2="322" stroke="#FF7A50" stroke-width="2.2" marker-end="url(#a-paid)"/>
<text x="350.0" y="314" text-anchor="middle" fill="#F1EFFA" font-size="13.5" font-weight="700" font-family="Arial, Helvetica, sans-serif">402: pay 0.60 USD</text>
<circle cx="24" cy="366" r="11" fill="#FF4F1A"/>
<text x="24" y="370" text-anchor="middle" fill="#0C0C10" font-size="12" font-weight="800" font-family="Arial, Helvetica, sans-serif">6</text>
<line x1="266" y1="370" x2="614" y2="370" stroke="#FF7A50" stroke-width="2.2" marker-end="url(#a-paid)"/>
<text x="440.0" y="362" text-anchor="middle" fill="#F1EFFA" font-size="13.5" font-weight="700" font-family="Arial, Helvetica, sans-serif">pays: test card or Tempo</text>
<circle cx="24" cy="414" r="11" fill="#FF4F1A"/>
<text x="24" y="418" text-anchor="middle" fill="#0C0C10" font-size="12" font-weight="800" font-family="Arial, Helvetica, sans-serif">7</text>
<line x1="266" y1="418" x2="434" y2="418" stroke="#FF7A50" stroke-width="2.2" marker-end="url(#a-paid)"/>
<text x="350.0" y="410" text-anchor="middle" fill="#F1EFFA" font-size="13.5" font-weight="700" font-family="Arial, Helvetica, sans-serif">retry with payment proof</text>
<circle cx="24" cy="462" r="11" fill="#FBE86A"/>
<text x="24" y="466" text-anchor="middle" fill="#0C0C10" font-size="12" font-weight="800" font-family="Arial, Helvetica, sans-serif">8</text>
<rect x="432" y="452" width="16" height="22" rx="3" fill="#C9C5E8" opacity=".9"/>
<text x="456" y="467" fill="#F1EFFA" font-size="13.5" font-family="Arial, Helvetica, sans-serif">34 rules decide, no LLM</text>
<circle cx="24" cy="510" r="11" fill="#FBE86A"/>
<text x="24" y="514" text-anchor="middle" fill="#0C0C10" font-size="12" font-weight="800" font-family="Arial, Helvetica, sans-serif">9</text>
<line x1="434" y1="514" x2="266" y2="514" stroke="#C9C5E8" stroke-width="2.2" marker-end="url(#a-free)"/>
<text x="350.0" y="506" text-anchor="middle" fill="#F1EFFA" font-size="13.5" font-family="Arial, Helvetica, sans-serif">verdict + receipt</text>
<circle cx="24" cy="558" r="11" fill="#FBE86A"/>
<text x="24" y="562" text-anchor="middle" fill="#0C0C10" font-size="12" font-weight="800" font-family="Arial, Helvetica, sans-serif">10</text>
<line x1="446" y1="562" x2="774" y2="562" stroke="#2BD46A" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#a-out)"/>
<text x="610.0" y="554" text-anchor="middle" fill="#F1EFFA" font-size="13.5" font-family="Arial, Helvetica, sans-serif">lands on the live screen</text>
<circle cx="24" cy="606" r="11" fill="#FBE86A"/>
<text x="24" y="610" text-anchor="middle" fill="#0C0C10" font-size="12" font-weight="800" font-family="Arial, Helvetica, sans-serif">11</text>
<line x1="266" y1="610" x2="774" y2="610" stroke="#2BD46A" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#a-out)"/>
<text x="520.0" y="602" text-anchor="middle" fill="#F1EFFA" font-size="13.5" font-family="Arial, Helvetica, sans-serif">compliance/ai-act-*.md</text>
<rect x="160" y="304" width="560" height="124" rx="8" fill="none" stroke="#FF7A50" stroke-width="1.2" stroke-dasharray="3 4"/>
<text x="716" y="320" text-anchor="end" fill="#FF7A50" font-size="11.5" font-weight="700" letter-spacing="0.7" font-family="Arial, Helvetica, sans-serif">THE PAYMENT, ABOUT 2 SECONDS</text>
<text x="440.0" y="656" text-anchor="middle" fill="#C9C5E8" font-size="12" font-family="Arial, Helvetica, sans-serif">Bad input is rejected before the 402, so the agent never pays for an answer it can't use.</text>
</svg>
